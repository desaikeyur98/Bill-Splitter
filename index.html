<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Bill Splitter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;min-height:100vh}
.app{max-width:600px;margin:0 auto;padding-bottom:20px}
.topbar{background:#1a2340;padding:14px 16px}
.topbar h1{color:#fff;font-size:.95rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.tabs{background:#fff;border-bottom:1px solid #e5e7eb;display:flex;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.tab-btn{flex:1;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;touch-action:manipulation}
.tab-btn.active{border-bottom:3px solid #2d7dd2;background:#f0f7ff}
.tab-icon{font-size:18px;line-height:1}
.tab-lbl{font-size:.65rem;font-weight:600;letter-spacing:.3px;color:#aaa}
.tab-btn.active .tab-lbl{color:#2d7dd2}
.page{display:none;padding:14px}
.page.active{display:block}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.07);padding:16px;margin-bottom:14px}
.sec-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#2d7dd2;margin-bottom:12px}
label{font-size:.75rem;color:#555;font-weight:500;display:block;margin-bottom:4px}
input{width:100%;padding:10px 12px;border:1.5px solid #d8dde6;border-radius:8px;font-size:.85rem;color:#222;outline:none;background:#fff;transition:border .2s}
input:focus{border-color:#2d7dd2;box-shadow:0 0 0 3px rgba(45,125,210,.1)}
input[readonly]{background:#ececec;color:#888}
input::placeholder{color:#bbc}
input[type=number]{-moz-appearance:textfield}
.btn-success{background:#1a7a3c;color:#fff;width:100%;padding:13px;font-size:.9rem;border-radius:10px;border:none;font-weight:700;cursor:pointer;touch-action:manipulation}
.btn-dl{background:#1a2340;color:#fff;flex:1;padding:13px;font-size:.85rem;border-radius:10px;border:none;font-weight:700;cursor:pointer;touch-action:manipulation}
.btn-print{background:#2d7dd2;color:#fff;flex:1;padding:13px;font-size:.85rem;border-radius:10px;border:none;font-weight:700;cursor:pointer;touch-action:manipulation}
.btn-outline{background:#fff;color:#444;border:1.5px solid #d0d5dd;font-size:.78rem;padding:8px 14px;border-radius:8px;cursor:pointer}
.btn-danger{background:#fee2e2;color:#b91c1c;border:none;border-radius:6px;padding:7px 10px;font-size:.8rem;cursor:pointer;flex-shrink:0;touch-action:manipulation}
.btn-add{background:#eff6ff;color:#2d7dd2;border:1.5px dashed #93c5fd;border-radius:8px;padding:9px;font-size:.8rem;font-weight:600;cursor:pointer;width:100%;text-align:center;touch-action:manipulation}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #d0d5dd;border-radius:8px;padding:8px 14px;font-size:.8rem;font-weight:600;cursor:pointer;margin-bottom:14px;touch-action:manipulation}
.couple-block{background:#f8f9fb;border-radius:10px;padding:13px;margin-bottom:10px;border:1px solid #eee}
.couple-block-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.couple-block-head input{flex:1;font-weight:700;border-color:#e5e7eb}
.member-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.member-row input{flex:1;font-size:.83rem}
.couple-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.couple-pill{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;font-size:.75rem;font-weight:600;border:1.5px solid}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.bill-block{background:#f8f9fb;border-radius:10px;padding:13px;margin-bottom:10px;border:1px solid #eee}
.bill-top{display:grid;grid-template-columns:1fr 100px 36px;gap:8px;align-items:end;margin-bottom:10px}
.chip-label{font-size:.68rem;color:#888;margin-bottom:5px;font-weight:500}
.chip-group{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:20px;font-size:.72rem;font-weight:600;cursor:pointer;border:1.5px solid #d0d5dd;background:#fff;color:#666;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.chip.on{background:#2d7dd2;color:#fff;border-color:#2d7dd2}
.chip.all-btn{border-style:dashed;color:#2d7dd2;border-color:#93c5fd;background:#eff6ff}
.couple-summary{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.cs-card{border-radius:10px;overflow:hidden;border:1px solid #e5e7eb}
.cs-head{padding:10px 13px;font-size:.78rem;font-weight:700;display:flex;align-items:center;gap:6px}
.cs-body{padding:11px 13px;background:#fff}
.cs-row{display:flex;justify-content:space-between;font-size:.8rem;padding:3px 0;color:#666}
.cs-row span:last-child{font-weight:600;color:#222}
.cs-sep{height:1px;background:#f0f0f0;margin:7px 0}
.cs-total{display:flex;justify-content:space-between;font-size:.88rem;font-weight:700}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.72rem;min-width:380px}
.tbl th{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#999;padding:6px 7px;text-align:right;border-bottom:1px solid #eee;white-space:nowrap}
.tbl th:first-child{text-align:left}
.tbl td{padding:6px 7px;text-align:right;border-bottom:1px solid #f5f5f5;color:#333;white-space:nowrap}
.tbl td:first-child{text-align:left;font-weight:500;color:#222}
.tbl .btd{background:#f8f9fb;color:#777}
.tbl .btd:first-child{font-weight:400;color:#555}
.tbl .tot-r td{font-weight:700;border-top:2px solid #e5e7eb;border-bottom:none;padding-top:9px}
.tbl .cpl-r td{font-weight:700;border-bottom:none;padding-top:3px;padding-bottom:8px}
.grand-txt{font-size:.78rem;color:#888;margin-bottom:10px}
.dl-row{display:flex;gap:10px;margin-bottom:10px}
.hd0{background:#e0f2fe;color:#0369a1}.c0{color:#0369a1}.dot0{background:#0369a1}.pill0{background:#e0f2fe;color:#0369a1;border-color:#7dd3fc}
.hd1{background:#dcfce7;color:#15803d}.c1{color:#15803d}.dot1{background:#15803d}.pill1{background:#dcfce7;color:#15803d;border-color:#86efac}
.hd2{background:#fef3c7;color:#92400e}.c2{color:#92400e}.dot2{background:#92400e}.pill2{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.hd3{background:#ede9fe;color:#5b21b6}.c3{color:#5b21b6}.dot3{background:#5b21b6}.pill3{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd}
.hd4{background:#fce7f3;color:#9d174d}.c4{color:#9d174d}.dot4{background:#9d174d}.pill4{background:#fce7f3;color:#9d174d;border-color:#f9a8d4}
/* ===== PASSWORD GATE ===== */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:#1a2340}
.auth-card{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.3);padding:26px 22px;width:100%;max-width:360px}
.auth-card h2{font-size:1.2rem;color:#1a2340;margin-bottom:4px}
.auth-card .sub{font-size:.78rem;color:#888;margin-bottom:18px;line-height:1.4}
.auth-card label{margin-top:12px}
.auth-card .btn-success{margin-top:18px}
.auth-err{background:#fee2e2;color:#b91c1c;font-size:.78rem;padding:9px 12px;border-radius:8px;margin-top:14px;display:none}
.auth-link{display:block;text-align:center;margin-top:14px;font-size:.74rem;color:#2d7dd2;cursor:pointer;text-decoration:underline}
.topbar-row{display:flex;align-items:center;justify-content:space-between}
.btn-lock{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:.72rem;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<!-- ===== PASSWORD GATE ===== -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card" id="authCard"></div>
</div>

<!-- ===== APP ===== -->
<div class="app" id="appRoot" style="display:none">
  <div class="topbar"><div class="topbar-row"><h1 id="topTitle">Bill Splitter</h1><button class="btn-lock" onclick="lockApp()">🔒 Lock</button></div></div>
  <div class="tabs">
    <button class="tab-btn active" id="tabHome" onclick="showTab('home')">
      <span class="tab-icon">🧾</span><span class="tab-lbl">BILLS</span>
    </button>
    <button class="tab-btn" id="tabCouples" onclick="showTab('couples')">
      <span class="tab-icon">👥</span><span class="tab-lbl">GROUPS</span>
    </button>
  </div>

  <!-- HOME -->
  <div class="page active" id="pageHome">
    <div id="homeSetup">
      <div class="card">
        <div class="sec-label">Groups</div>
        <div class="couple-pills" id="homePills"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div class="sec-label" style="margin:0">Bills</div>
          <button class="btn-outline" onclick="addBill()">+ Add Bill</button>
        </div>
        <div id="billsList"></div>
      </div>
      <button class="btn-success" onclick="calculate()">Calculate Split</button>
    </div>
    <div id="homeResults" style="display:none">
      <button class="back-btn" onclick="backToSetup()">← Edit</button>
      <div class="couple-summary" id="resCouples"></div>
      <div class="card">
        <div class="grand-txt" id="grandLbl"></div>
        <div class="tbl-scroll"><table class="tbl" id="resTbl"></table></div>
      </div>
      <div class="dl-row">
        <button class="btn-dl" onclick="openReport(false)">⬇ Download PDF</button>
        <button class="btn-print" onclick="openReport(true)">🖨 Print</button>
      </div>
      <button class="btn-success" onclick="backToSetup()">← Edit Bills</button>
    </div>
  </div>

  <!-- GROUPS -->
  <div class="page" id="pageCouples">
    <div class="card">
      <div class="sec-label">Manage Couples / Groups</div>
      <div id="couplesList"></div>
      <button class="btn-add" onclick="addCouple()">+ Add Couple / Group</button>
    </div>
  </div>
</div>

<script>
/* ===================== MASTER PASSWORD GATE ===================== */
/* ============================================================
   >>> SET YOUR MASTER PASSWORD HERE <<<
   This is the ONE password you (the owner) hold. Everyone who
   opens the app must type it to get in. To change it later,
   just edit the value below and re-upload the file.
   Note: this file's source is readable by anyone who has it,
   so this is a gate to keep casual users out — not bank-grade
   security.
   ============================================================ */
var MASTER_PASSWORD = 'Hstk@0246';

function renderAuth(){
  var c=document.getElementById('authCard');
  c.innerHTML='<h2>Bill Splitter</h2>'
    +'<div class="sub">Enter the master password to continue.</div>'
    +'<label>Master password</label>'
    +'<input type="password" id="mp1" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doUnlock()" />'
    +'<div class="auth-err" id="authErr"></div>'
    +'<button class="btn-success" onclick="doUnlock()">Unlock</button>';
  setTimeout(function(){var f=document.getElementById('mp1');if(f)f.focus();},50);
}
function doUnlock(){
  var a=document.getElementById('mp1').value, e=document.getElementById('authErr');
  if(a===MASTER_PASSWORD){ unlock(); }
  else { e.textContent='Incorrect password.';e.style.display='block'; document.getElementById('mp1').value=''; }
}
function unlock(){
  document.getElementById('authScreen').style.display='none';
  document.getElementById('appRoot').style.display='block';
  loadData(); showTab('home'); window.scrollTo(0,0);
}
function lockApp(){
  saveData();
  document.getElementById('appRoot').style.display='none';
  document.getElementById('authScreen').style.display='flex';
  renderAuth();
}

/* ===================== DATA (saved on this device) ===================== */
function defaultCouples(){return [
  {name:'Sumit & Mital',members:['Sumit','Mital']},
  {name:'KD & Ruhi',members:['KD','Ruhi']},
  {name:'Keyur & Dhamu',members:['Keyur','Dhamu']}
];}
function defaultBills(){return [
  {name:'Rent',amount:2000,locked:true,members:null},
  {name:'Utility',amount:227,locked:false,members:null},
  {name:'Internet',amount:52.64,locked:false,members:null},
  {name:'Bill 1',amount:403,locked:false,members:null},
  {name:'Bill 2',amount:201,locked:false,members:['KD','Ruhi','Keyur','Dhamu']},
  {name:'Bill 3',amount:476,locked:false,members:['KD','Sumit','Keyur','Dhamu']}
];}

var couples=defaultCouples();
var bills=defaultBills();

function loadData(){
  var raw=localStorage.getItem('bs_appdata');
  if(raw){try{var d=JSON.parse(raw);couples=d.couples||defaultCouples();bills=d.bills||defaultBills();}catch(e){}}
}
function saveData(){
  if(document.getElementById('appRoot').style.display==='none') return;
  localStorage.setItem('bs_appdata',JSON.stringify({couples:couples,bills:bills}));
}

/* ===================== BILL SPLITTER ===================== */
function getAllPeople(){
  var a=[];
  couples.forEach(function(c){
    c.members.forEach(function(m){if(m.trim()&&!a.includes(m))a.push(m);});
  });
  return a;
}

function showTab(t){
  document.getElementById('pageHome').classList.toggle('active',t==='home');
  document.getElementById('pageCouples').classList.toggle('active',t==='couples');
  document.getElementById('tabHome').classList.toggle('active',t==='home');
  document.getElementById('tabCouples').classList.toggle('active',t==='couples');
  document.getElementById('topTitle').textContent=t==='home'?'Bill Splitter':'Couples & Groups';
  if(t==='home'){renderHomePills();renderBills();}
  if(t==='couples') renderCouples();
}

function renderCouples(){
  var el=document.getElementById('couplesList');
  el.innerHTML='';
  couples.forEach(function(c,ci){
    var d=document.createElement('div');
    d.className='couple-block';
    var mHTML='';
    c.members.forEach(function(m,mi){
      mHTML+='<div class="member-row">'
        +'<input type="text" value="'+m+'" placeholder="Name" oninput="couples['+ci+'].members['+mi+']=this.value;renderHomePills();renderBills()" />'
        +'<button class="btn-danger" onclick="removeMember('+ci+','+mi+')">x</button>'
        +'</div>';
    });
    d.innerHTML='<div class="couple-block-head">'
      +'<span class="dot dot'+(ci%5)+'" style="width:10px;height:10px"></span>'
      +'<input type="text" value="'+c.name+'" oninput="couples['+ci+'].name=this.value;renderHomePills()" />'
      +'<button class="btn-danger" onclick="removeCouple('+ci+')">x</button>'
      +'</div>'+mHTML
      +'<button class="btn-add" style="padding:7px;font-size:.73rem;margin-top:4px" onclick="addMember('+ci+')">+ Add Member</button>';
    el.appendChild(d);
  });
}

function addCouple(){couples.push({name:'New Group',members:['Person 1','Person 2']});renderCouples();renderHomePills();renderBills();}
function removeCouple(i){couples.splice(i,1);renderCouples();renderHomePills();renderBills();}
function addMember(ci){couples[ci].members.push('');renderCouples();}
function removeMember(ci,mi){couples[ci].members.splice(mi,1);renderCouples();renderHomePills();renderBills();}

function renderHomePills(){
  var el=document.getElementById('homePills');
  if(!el) return;
  el.innerHTML='';
  couples.forEach(function(c,ci){
    el.innerHTML+='<div class="couple-pill pill'+(ci%5)+'">'
      +'<span class="dot dot'+(ci%5)+'"></span>'+c.name+'</div>';
  });
}

function renderBills(){
  var people=getAllPeople();
  var el=document.getElementById('billsList');
  if(!el) return;
  el.innerHTML='';
  bills.forEach(function(b,bi){
    var sel=b.members?b.members:[].concat(people);
    var d=document.createElement('div');
    d.className='bill-block';
    var chips=people.map(function(p){
      var on=sel.includes(p);
      return '<span class="chip'+(on?' on':'')+'" onclick="togglePerson('+bi+',\''+p+'\')">'+(on?'+ ':'')+p+'</span>';
    }).join('');
    chips+='<span class="chip all-btn" onclick="selectAll('+bi+')">All</span>';
    d.innerHTML='<div class="bill-top">'
      +'<div><label>Bill name</label><input type="text" value="'+b.name+'"'+(b.locked?' readonly':'')+' oninput="bills['+bi+'].name=this.value" /></div>'
      +'<div><label>Amount</label><input type="number" value="'+b.amount+'" step="0.01" min="0" oninput="bills['+bi+'].amount=parseFloat(this.value)||0" /></div>'
      +'<button class="btn-danger" style="margin-top:20px" onclick="removeBill('+bi+')"'+(b.locked?' disabled style="opacity:.3"':'')+'>x</button>'
      +'</div><div class="chip-label">Split between</div><div class="chip-group">'+chips+'</div>';
    el.appendChild(d);
  });
}

function togglePerson(bi,p){
  var people=getAllPeople();
  if(!bills[bi].members) bills[bi].members=[].concat(people);
  var idx=bills[bi].members.indexOf(p);
  if(idx>-1) bills[bi].members.splice(idx,1); else bills[bi].members.push(p);
  renderBills();
}
function selectAll(bi){bills[bi].members=null;renderBills();}
function addBill(){bills.push({name:'New Bill',amount:0,locked:false,members:null});renderBills();}
function removeBill(i){if(!bills[i].locked){bills.splice(i,1);renderBills();}}

function computeTotals(){
  var people=getAllPeople();
  var t={};
  people.forEach(function(p){t[p]=0;});
  bills.forEach(function(b){
    var mem=b.members?b.members.filter(function(m){return people.includes(m);}):people;
    if(!mem.length) return;
    var share=b.amount/mem.length;
    mem.forEach(function(p){if(t[p]!==undefined) t[p]+=share;});
  });
  return t;
}

function calculate(){
  var people=getAllPeople();
  var totals=computeTotals();
  var grand=bills.reduce(function(s,b){return s+b.amount;},0);

  var rc=document.getElementById('resCouples');
  rc.innerHTML='';
  couples.forEach(function(c,ci){
    var col=ci%5;
    var combined=c.members.reduce(function(s,p){return s+(totals[p]||0);},0);
    var pRows=c.members.map(function(m){
      return '<div class="cs-row"><span>'+m+'</span><span>$'+(totals[m]||0).toFixed(2)+'</span></div>';
    }).join('');
    rc.innerHTML+='<div class="cs-card">'
      +'<div class="cs-head hd'+col+'"><span class="dot dot'+col+'"></span>'+c.name+'</div>'
      +'<div class="cs-body">'+pRows+'<div class="cs-sep"></div>'
      +'<div class="cs-total"><span>Combined</span><span class="c'+col+'">$'+combined.toFixed(2)+'</span></div>'
      +'</div></div>';
  });

  document.getElementById('grandLbl').textContent='Grand total: $'+grand.toFixed(2);

  var hdr='<thead><tr><th>Bill</th><th>Amt</th><th>Div</th>';
  couples.forEach(function(c,ci){
    c.members.forEach(function(m){hdr+='<th class="c'+(ci%5)+'">'+m+'</th>';});
  });
  hdr+='</tr></thead>';

  var body='<tbody>';
  bills.forEach(function(b){
    var mem=b.members?b.members.filter(function(m){return people.includes(m);}):people;
    var share=mem.length?b.amount/mem.length:0;
    var row='<tr class="btd"><td>'+b.name+'</td><td>$'+b.amount.toFixed(2)+'</td><td>'+mem.length+'</td>';
    couples.forEach(function(c,ci){
      c.members.forEach(function(m){
        row+=mem.includes(m)?'<td class="c'+(ci%5)+'">$'+share.toFixed(2)+'</td>':'<td style="color:#ccc">-</td>';
      });
    });
    body+=row+'</tr>';
  });

  var tot='<tr class="tot-r"><td>Total</td><td>$'+grand.toFixed(2)+'</td><td></td>';
  couples.forEach(function(c,ci){
    c.members.forEach(function(m){tot+='<td class="c'+(ci%5)+'">$'+(totals[m]||0).toFixed(2)+'</td>';});
  });
  body+=tot+'</tr>';

  var cRow='<tr class="cpl-r"><td style="color:#aaa;font-size:.65rem">Couple</td><td></td><td></td>';
  couples.forEach(function(c,ci){
    var combined=c.members.reduce(function(s,p){return s+(totals[p]||0);},0);
    cRow+='<td colspan="'+c.members.length+'" class="c'+(ci%5)+'" style="text-align:center">$'+combined.toFixed(2)+'</td>';
  });
  body+=cRow+'</tr></tbody>';
  document.getElementById('resTbl').innerHTML=hdr+body;

  document.getElementById('homeSetup').style.display='none';
  document.getElementById('homeResults').style.display='block';
  window.scrollTo(0,0);
}

function backToSetup(){
  document.getElementById('homeSetup').style.display='block';
  document.getElementById('homeResults').style.display='none';
}

function buildReportHTML(autoPrint){
  var people=getAllPeople();
  var totals=computeTotals();
  var grand=bills.reduce(function(s,b){return s+b.amount;},0);
  var now=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  var clrs=['#0369a1','#15803d','#92400e','#5b21b6','#9d174d'];
  var bgs=['#e0f2fe','#dcfce7','#fef3c7','#ede9fe','#fce7f3'];

  var coupleHTML='';
  couples.forEach(function(c,ci){
    var col=clrs[ci%5]; var bg=bgs[ci%5];
    var combined=c.members.reduce(function(s,p){return s+(totals[p]||0);},0);
    var rows='';
    c.members.forEach(function(m){
      rows+='<div style="display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:#555">'
        +'<span>'+m+'</span><b style="color:#222">$'+(totals[m]||0).toFixed(2)+'</b></div>';
    });
    coupleHTML+='<div style="flex:1;min-width:150px;border-radius:8px;overflow:hidden;border:1px solid #e5e7eb">'
      +'<div style="background:'+bg+';color:'+col+';padding:8px 12px;font-size:12px;font-weight:700">'+c.name+'</div>'
      +'<div style="padding:10px 12px;background:#fff">'+rows
      +'<div style="height:1px;background:#eee;margin:6px 0"></div>'
      +'<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700">'
      +'<span>Combined</span><span style="color:'+col+'">$'+combined.toFixed(2)+'</span></div>'
      +'</div></div>';
  });

  var thHTML='<th style="text-align:left;padding:6px 8px;font-size:10px;text-transform:uppercase;color:#888;border-bottom:2px solid #eee;background:#f8f9fb">Bill</th>'
    +'<th style="padding:6px 8px;font-size:10px;text-transform:uppercase;color:#888;border-bottom:2px solid #eee;text-align:right;background:#f8f9fb">Amount</th>'
    +'<th style="padding:6px 8px;font-size:10px;text-transform:uppercase;color:#888;border-bottom:2px solid #eee;text-align:right;background:#f8f9fb">Split</th>';
  couples.forEach(function(c,ci){
    c.members.forEach(function(m){
      thHTML+='<th style="padding:6px 8px;font-size:10px;text-transform:uppercase;color:'+clrs[ci%5]+';border-bottom:2px solid #eee;text-align:right;background:#f8f9fb">'+m+'</th>';
    });
  });

  var tbHTML='';
  bills.forEach(function(b){
    var mem=b.members?b.members.filter(function(m){return people.includes(m);}):people;
    var share=mem.length?b.amount/mem.length:0;
    var row='<tr style="background:#f8f9fb">'
      +'<td style="padding:6px 8px;font-size:11px;border-bottom:1px solid #f0f0f0">'+b.name+'</td>'
      +'<td style="padding:6px 8px;font-size:11px;border-bottom:1px solid #f0f0f0;text-align:right">$'+b.amount.toFixed(2)+'</td>'
      +'<td style="padding:6px 8px;font-size:11px;border-bottom:1px solid #f0f0f0;text-align:right;color:#aaa">'+mem.length+'</td>';
    couples.forEach(function(c,ci){
      c.members.forEach(function(m){
        if(mem.includes(m)){
          row+='<td style="padding:6px 8px;font-size:11px;border-bottom:1px solid #f0f0f0;text-align:right;color:'+clrs[ci%5]+';font-weight:600">$'+share.toFixed(2)+'</td>';
        } else {
          row+='<td style="padding:6px 8px;font-size:11px;border-bottom:1px solid #f0f0f0;text-align:right;color:#ddd">-</td>';
        }
      });
    });
    tbHTML+=row+'</tr>';
  });

  var totRow='<tr>'
    +'<td style="padding:9px 8px;font-weight:700;border-top:2px solid #e5e7eb">Individual Total</td>'
    +'<td style="padding:9px 8px;font-weight:700;border-top:2px solid #e5e7eb;text-align:right">$'+grand.toFixed(2)+'</td>'
    +'<td style="border-top:2px solid #e5e7eb"></td>';
  couples.forEach(function(c,ci){
    c.members.forEach(function(m){
      totRow+='<td style="padding:9px 8px;font-weight:700;border-top:2px solid #e5e7eb;text-align:right;color:'+clrs[ci%5]+'">$'+(totals[m]||0).toFixed(2)+'</td>';
    });
  });
  totRow+='</tr>';

  var cplRow='<tr><td style="padding:4px 8px 10px;font-size:10px;color:#aaa">Couple Total</td><td></td><td></td>';
  couples.forEach(function(c,ci){
    var combined=c.members.reduce(function(s,p){return s+(totals[p]||0);},0);
    cplRow+='<td colspan="'+c.members.length+'" style="padding:4px 8px 10px;font-weight:700;text-align:center;color:'+clrs[ci%5]+'">$'+combined.toFixed(2)+'</td>';
  });
  cplRow+='</tr>';

  var printScript=autoPrint?'<script>window.onload=function(){window.print();}<\/script>':'';

  return '<!DOCTYPE html><html><head><meta charset="UTF-8">'
    +'<style>body{font-family:Arial,sans-serif;padding:24px;color:#222;max-width:960px;margin:0 auto}'
    +'h2{font-size:16px;text-transform:uppercase;letter-spacing:1px;color:#1a2340;margin-bottom:4px}'
    +'.sub{font-size:12px;color:#888;margin-bottom:20px}'
    +'table{width:100%;border-collapse:collapse}'
    +'@media print{@page{margin:15mm}}</style>'
    +printScript
    +'</head><body>'
    +'<h2>Bill Split Summary</h2>'
    +'<div class="sub">Generated: '+now+' | Grand Total: $'+grand.toFixed(2)+'</div>'
    +'<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px">'+coupleHTML+'</div>'
    +'<table><thead><tr>'+thHTML+'</tr></thead>'
    +'<tbody>'+tbHTML+totRow+cplRow+'</tbody>'
    +'</table></body></html>';
}

function openReport(autoPrint){
  var html=buildReportHTML(autoPrint);
  var blob=new Blob([html],{type:'text/html'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.target='_blank';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},3000);
}

/* Autosave bills/groups to this device */
setInterval(saveData,1500);
window.addEventListener('beforeunload',saveData);

/* Start at the password gate */
renderAuth();
</script>
</body>
</html>
